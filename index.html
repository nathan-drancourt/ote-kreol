<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oté ! Kréol — apprendre le créole réunionnais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#58CC02;  --green-d:#46A302;  --green-l:#D7FFB8;
    --blue:#1CB0F6;   --blue-d:#1899D6;   --blue-l:#DDF4FF;
    --red:#FF4B4B;    --red-d:#E03B3B;    --red-l:#FFDFE0;
    --gold:#FFC800;   --gold-d:#E6A800;
    --purple:#CE82FF; --purple-d:#A560E8;
    --orange:#FF9600; --orange-d:#E08600;
    --gray:#E5E5E5;   --gray-d:#CFCFCF;
    --ink:#3C3C3C;    --muted:#777;
    --line:#E5E5E5;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Nunito',system-ui,sans-serif; font-weight:700; color:var(--ink); background:#fff; min-height:100vh; }
  button{ font-family:inherit; font-weight:inherit; cursor:pointer; }
  :focus-visible{ outline:3px solid var(--blue); outline-offset:2px; border-radius:8px; }
  h1,h2,h3{ font-weight:900; }

  /* ============ Barre du haut ============ */
  .statbar{ position:sticky; top:0; z-index:20; background:#fff; border-bottom:2px solid var(--line); }
  .statbar-in{ max-width:600px; margin:0 auto; padding:10px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .logo{ font-weight:900; font-size:1.2rem; color:var(--green); letter-spacing:-.5px; }
  .logo em{ font-style:normal; color:var(--gold); }
  .stats-right{ display:flex; align-items:center; gap:14px; font-weight:900; font-size:1rem; }
  .stat.streak{ color:var(--orange); } .stat.xp{ color:var(--gold-d); }
  .iconbtn{ background:none; border:none; font-size:1.15rem; }
  body.in-lesson .statbar, body.in-lesson .tabbar{ display:none; }

  main{ max-width:600px; margin:0 auto; padding:16px 16px 110px; }

  /* ============ Onglets du bas ============ */
  .tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:25;
    background:#fff; border-top:2px solid var(--line); }
  .tabbar-in{ max-width:600px; margin:0 auto; display:flex; }
  .tab{ flex:1; background:none; border:none; padding:9px 4px 10px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:.66rem; font-weight:900; letter-spacing:.04em; color:#AFAFAF; text-transform:uppercase; }
  .tab .ti{ font-size:1.35rem; }
  .tab.active{ color:var(--blue); }
  .tab.active .ti{ transform:scale(1.12); }

  /* ============ Cartes génériques ============ */
  .card{ border:2px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; background:#fff; }
  .card h3{ font-size:1.05rem; margin-bottom:8px; }
  .soft{ color:var(--muted); font-weight:700; font-size:.9rem; }

  .goal-card{ display:flex; align-items:center; gap:14px; }
  .goal-card .g-ic{ font-size:1.8rem; }
  .goal-card .g-body{ flex:1; }
  .gbar{ height:12px; background:var(--gray); border-radius:99px; overflow:hidden; margin-top:6px; }
  .gbar span{ display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .4s; }

  .mascot-hello{ display:flex; gap:12px; align-items:center; margin:6px 0 16px;
    background:#F7F7F7; border:2px solid var(--line); border-radius:16px; padding:12px 16px; }
  .mascot-hello .m{ font-size:2.1rem; }
  .mascot-hello p{ font-size:.92rem; }

  /* ============ Parcours ============ */
  .sec-banner{ background:var(--sc); color:#fff; border-radius:18px; padding:18px 20px; margin:30px 0 6px;
    box-shadow:0 5px 0 var(--sd); }
  .sec-banner .s-eyebrow{ font-size:.7rem; letter-spacing:.16em; opacity:.85; font-weight:900; }
  .sec-banner h2{ font-size:1.5rem; }
  .sec-banner .s-fr{ font-size:.9rem; opacity:.9; }

  .unit-banner{ background:var(--uc); color:#fff; border-radius:14px; padding:12px 18px; margin:22px 0 4px;
    box-shadow:0 4px 0 var(--ud); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .unit-banner h2{ font-size:1.15rem; }
  .unit-banner .u-fr{ font-size:.84rem; opacity:.9; }
  .unit-banner .u-emoji{ font-size:1.7rem; }

  .path-seg{ display:flex; flex-direction:column; align-items:center; padding:12px 0 2px; }
  .node-wrap{ position:relative; margin:13px 0; }
  .node{ width:70px; height:70px; border-radius:50%; border:none; color:#fff; font-size:1.6rem;
    background:var(--uc); box-shadow:0 7px 0 var(--ud);
    display:flex; align-items:center; justify-content:center; transition:transform .1s; }
  .node:active{ transform:translateY(4px); box-shadow:0 3px 0 var(--ud); }
  .node.locked{ background:var(--gray); box-shadow:0 7px 0 var(--gray-d); color:#AFAFAF; cursor:not-allowed; }
  .node.done::after{ content:"✓"; position:absolute; right:-4px; top:-4px;
    background:var(--gold); color:#fff; font-size:.8rem; font-weight:900; width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 0 var(--gold-d); }
  .node.current{ animation:breathe 1.6s ease-in-out infinite; }
  .start-bubble{ position:absolute; left:50%; transform:translateX(-50%); top:-42px;
    background:#fff; border:2px solid var(--line); border-radius:12px; padding:5px 12px;
    font-weight:900; font-size:.76rem; letter-spacing:.1em; color:var(--uc); white-space:nowrap;
    animation:hop 1.2s ease-in-out infinite; z-index:2; }
  .start-bubble::after{ content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%) rotate(45deg);
    width:12px; height:12px; background:#fff; border-right:2px solid var(--line); border-bottom:2px solid var(--line); }
  .node-label{ text-align:center; font-size:.78rem; color:var(--muted); margin-top:7px; font-weight:800; }
  @keyframes hop{ 0%,100%{ transform:translateX(-50%) translateY(0);} 50%{ transform:translateX(-50%) translateY(-5px);} }
  @keyframes breathe{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }

  /* ============ Leçon / session ============ */
  .lesson-top{ display:flex; align-items:center; gap:14px; max-width:600px; margin:0 auto; padding:16px 16px 6px; }
  .xbtn{ background:none; border:none; font-size:1.35rem; color:#AFAFAF; font-weight:900; }
  .xbtn:hover{ color:var(--ink); }
  .ltrack{ flex:1; height:16px; background:var(--gray); border-radius:99px; overflow:hidden; }
  .ltrack span{ display:block; height:100%; width:0%; background:var(--green); border-radius:99px; position:relative; transition:width .35s; }
  .ltrack span::after{ content:""; position:absolute; left:8px; right:8px; top:4px; height:4px;
    background:rgba(255,255,255,.35); border-radius:99px; }
  .hearts{ font-size:1rem; letter-spacing:2px; white-space:nowrap; }
  .hearts .lost{ filter:grayscale(1); opacity:.3; }
  .timer{ font-weight:900; font-size:1.1rem; color:var(--orange); min-width:52px; text-align:right; }

  .ex-area{ max-width:600px; margin:0 auto; padding:16px 16px 180px; }
  .ex-title{ font-size:1.35rem; margin-bottom:16px; }

  .speech{ display:flex; align-items:flex-end; gap:10px; margin-bottom:20px; }
  .speech .m{ font-size:2.3rem; line-height:1; }
  .bubble{ border:2px solid var(--line); border-radius:14px; padding:10px 14px;
    font-size:1.12rem; font-weight:800; position:relative; background:#fff; }
  .bubble::after{ content:""; position:absolute; left:-8px; bottom:12px; width:12px; height:12px;
    background:#fff; border-left:2px solid var(--line); border-bottom:2px solid var(--line); transform:rotate(45deg); }
  .bubble .sub{ display:block; font-size:.85rem; color:var(--muted); font-weight:700; margin-top:2px; }

  .bigplay{ display:block; margin:8px auto 26px; width:96px; height:96px; border-radius:26px;
    border:none; background:var(--blue); box-shadow:0 6px 0 var(--blue-d);
    color:#fff; font-size:2.4rem; }
  .bigplay:active{ transform:translateY(3px); box-shadow:0 3px 0 var(--blue-d); }
  .minisay{ background:none; border:none; font-size:1.1rem; padding:0 4px; }

  .options{ display:grid; gap:10px; }
  .option{ text-align:left; background:#fff; border:2px solid var(--line); border-radius:14px;
    box-shadow:0 3px 0 var(--line); padding:12px 14px; font-size:1.02rem; font-weight:700; color:var(--ink);
    display:flex; align-items:center; gap:12px; transition:border-color .12s, background .12s; }
  .option .okey{ width:26px; height:26px; border-radius:8px; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:.78rem; color:var(--muted); flex:none; }
  .option:hover:not(:disabled){ background:#F7F7F7; }
  .option.selected{ border-color:#84D8FF; background:var(--blue-l); box-shadow:0 3px 0 #84D8FF; color:var(--blue-d); }
  .option.selected .okey{ border-color:#84D8FF; color:var(--blue-d); }
  .option.right{ border-color:var(--green); background:var(--green-l); box-shadow:0 3px 0 var(--green); color:var(--green-d); }
  .option.wrongsel{ border-color:var(--red); background:var(--red-l); box-shadow:0 3px 0 var(--red); color:var(--red-d); }
  .option:disabled{ cursor:default; }

  .fillline{ font-size:1.3rem; font-weight:900; text-align:center; margin:6px 0 4px; line-height:1.6; }
  .fillline .gap{ display:inline-block; min-width:70px; border-bottom:3px solid var(--ink); margin:0 4px; color:var(--blue-d); }
  .fillhint{ text-align:center; color:var(--muted); font-size:.92rem; margin-bottom:20px; }

  .answerline{ min-height:56px; border-top:2px solid var(--line); border-bottom:2px solid var(--line);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 2px; margin-bottom:20px; }
  .tilebank{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .tile{ background:#fff; border:2px solid var(--line); border-radius:12px; box-shadow:0 3px 0 var(--line);
    padding:9px 14px; font-size:1rem; font-weight:800; color:var(--ink); }
  .tile:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--line); }
  .tile.ghost{ opacity:0; pointer-events:none; }

  .match{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mcol{ display:grid; gap:10px; align-content:start; }
  .mbtn{ background:#fff; border:2px solid var(--line); border-radius:14px; box-shadow:0 3px 0 var(--line);
    padding:13px 10px; font-size:.98rem; font-weight:800; color:var(--ink); }
  .mbtn.selected{ border-color:#84D8FF; background:var(--blue-l); color:var(--blue-d); box-shadow:0 3px 0 #84D8FF; }
  .mbtn.matched{ border-color:var(--green); background:var(--green-l); color:var(--green-d); opacity:.55; cursor:default; box-shadow:none; }
  .mbtn.shake{ animation:shake .3s; border-color:var(--red); background:var(--red-l); }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

  .tinput{ width:100%; font-family:inherit; font-size:1.12rem; font-weight:700;
    border:2px solid var(--line); border-radius:14px; padding:14px; background:#F7F7F7; color:var(--ink); }
  .tinput:focus{ outline:none; border-color:var(--blue); background:#fff; }

  .tipcard{ max-width:600px; margin:0 auto; padding:20px 16px 40px; }
  .tipbox{ border:2px solid var(--purple); border-radius:18px; overflow:hidden; margin-bottom:20px; }
  .tipbox .tiphead{ background:var(--purple); color:#fff; padding:12px 16px; font-weight:900; }
  .tipbox .tipbody{ padding:16px; }
  .tipbody p{ margin-bottom:10px; font-weight:700; }
  .tipbody .ex{ background:#F7F1FF; border-radius:10px; padding:8px 12px; margin:6px 0; font-weight:800; }
  .tipbody .ex i{ display:block; color:var(--muted); font-weight:700; font-style:normal; font-size:.88rem; }

  /* ============ Barre de vérification ============ */
  .checkbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:2px solid var(--line); padding:14px 16px; }
  .checkbar.ok{ background:var(--green-l); border-color:#A8E063; }
  .checkbar.ko{ background:var(--red-l); border-color:#F5B1B1; }
  .checkbar-in{ max-width:600px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .fb{ display:flex; align-items:center; gap:12px; min-height:44px; }
  .fb-ic{ width:44px; height:44px; border-radius:50%; background:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:1.35rem; font-weight:900; }
  .ok .fb-ic{ color:var(--green-d); } .ko .fb-ic{ color:var(--red-d); }
  .fb-t{ font-weight:900; font-size:1.06rem; }
  .ok .fb-t, .ok .fb-s{ color:var(--green-d); } .ko .fb-t, .ko .fb-s{ color:var(--red-d); }
  .fb-s{ font-size:.92rem; font-weight:700; }

  .btn-duo{ border:none; border-radius:14px; padding:13px 24px; font-size:.92rem; font-weight:900;
    letter-spacing:.08em; text-transform:uppercase; color:#fff; background:var(--green);
    box-shadow:0 4px 0 var(--green-d); transition:filter .12s; }
  .btn-duo:hover:not(:disabled){ filter:brightness(1.06); }
  .btn-duo:active:not(:disabled){ transform:translateY(2px); box-shadow:0 2px 0 var(--green-d); }
  .btn-duo:disabled{ background:var(--gray); box-shadow:0 4px 0 var(--gray-d); color:#AFAFAF; cursor:not-allowed; }
  .btn-duo.red{ background:var(--red); box-shadow:0 4px 0 var(--red-d); }
  .btn-duo.blue{ background:var(--blue); box-shadow:0 4px 0 var(--blue-d); }
  .btn-duo.white{ background:#fff; color:var(--blue); box-shadow:0 4px 0 var(--line); border:2px solid var(--line); }
  .btn-duo.wide{ display:block; width:100%; }

  /* ============ Écrans / modales ============ */
  .center-screen{ max-width:600px; margin:0 auto; padding:50px 20px; text-align:center; }
  .center-screen .m-big{ font-size:4.2rem; animation:pop .45s; }
  @keyframes pop{ 0%{ transform:scale(.4); opacity:0;} 100%{ transform:scale(1); opacity:1;} }
  .cheer{ font-size:1.1rem; font-weight:900; color:var(--gold-d); margin-top:6px; }
  .center-screen h2{ font-size:1.7rem; margin:8px 0 22px; }
  .rescards{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:26px; }
  .rescard{ border:2px solid var(--rc); border-radius:16px; overflow:hidden; min-width:112px; }
  .rescard span{ display:block; background:var(--rc); color:#fff; font-size:.68rem; font-weight:900; letter-spacing:.1em; padding:5px 10px; }
  .rescard b{ display:block; font-size:1.4rem; font-weight:900; padding:11px 10px; color:var(--rc); }
  .newbadges{ margin:-8px 0 22px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .badgechip{ background:#FFF6DA; border:2px solid var(--gold); color:var(--gold-d);
    border-radius:99px; padding:6px 14px; font-weight:900; font-size:.88rem; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background:#fff; border-radius:20px; padding:26px 22px; max-width:380px; width:100%; text-align:center; }
  .modal .m{ font-size:2.8rem; }
  .modal h3{ font-size:1.25rem; margin:10px 0 6px; }
  .modal p{ color:var(--muted); font-size:.92rem; margin-bottom:18px; font-weight:700; }
  .modal .btns{ display:flex; flex-direction:column; gap:12px; }

  /* ============ Entraînement ============ */
  .train-card{ display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    border:2px solid var(--line); border-radius:16px; background:#fff; box-shadow:0 3px 0 var(--line);
    padding:14px 16px; margin-bottom:12px; }
  .train-card:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--line); }
  .train-card .t-ic{ font-size:1.9rem; }
  .train-card .t-body{ flex:1; }
  .train-card h3{ font-size:1.02rem; }
  .train-card .due{ background:var(--red); color:#fff; border-radius:99px; font-size:.75rem;
    font-weight:900; padding:3px 10px; }
  .train-card:disabled{ opacity:.5; box-shadow:0 3px 0 var(--line); cursor:not-allowed; }

  /* ============ Dico ============ */
  .search{ width:100%; font-family:inherit; font-weight:700; font-size:1rem;
    border:2px solid var(--line); border-radius:14px; padding:12px 14px; background:#F7F7F7; margin-bottom:14px; }
  .search:focus{ outline:none; border-color:var(--blue); background:#fff; }
  .dic-unit{ margin:18px 0 6px; font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:900; }
  .dic-row{ display:flex; gap:10px; align-items:flex-start; padding:10px 4px; border-bottom:2px solid #F0F0F0; }
  .dic-row .d-kr{ font-weight:900; font-size:1.02rem; }
  .dic-row .d-fr{ color:var(--muted); font-size:.9rem; font-weight:700; }
  .dic-row .d-ex{ color:#9a9a9a; font-size:.84rem; font-weight:600; font-style:italic; }
  .dots{ display:inline-flex; gap:3px; margin-left:8px; vertical-align:middle; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:var(--gray); }
  .dots i.on{ background:var(--green); }

  /* ============ Grammaire ============ */
  .gram-card{ border:2px solid var(--line); border-radius:16px; margin-bottom:14px; overflow:hidden; }
  .gram-card > button{ width:100%; text-align:left; background:#fff; border:none; padding:14px 16px;
    font-size:1rem; font-weight:900; display:flex; justify-content:space-between; align-items:center; }
  .gram-card .g-body{ padding:0 16px 16px; display:none; }
  .gram-card.open .g-body{ display:block; }
  .gram-card table{ width:100%; border-collapse:collapse; margin:8px 0; font-size:.92rem; }
  .gram-card td{ border:2px solid #F0F0F0; padding:7px 9px; }
  .gram-card td:first-child{ font-weight:900; color:var(--blue-d); white-space:nowrap; }
  .gram-card p{ font-weight:700; font-size:.92rem; margin:8px 0; }
  .gram-card .ex{ background:#F3FAF3; border-radius:10px; padding:7px 11px; margin:6px 0; font-weight:800; font-size:.94rem; }
  .gram-card .ex i{ display:block; color:var(--muted); font-weight:700; font-style:normal; font-size:.84rem; }

  /* ============ Profil ============ */
  .prof-head{ display:flex; gap:14px; align-items:center; margin-bottom:16px; }
  .prof-head .av{ font-size:3rem; background:#F1FBE9; border:2px solid var(--green); border-radius:20px;
    width:76px; height:76px; display:flex; align-items:center; justify-content:center; }
  .prof-head h2{ font-size:1.3rem; }
  .lvlbar{ height:12px; background:var(--gray); border-radius:99px; overflow:hidden; margin-top:6px; }
  .lvlbar span{ display:block; height:100%; background:var(--blue); border-radius:99px; }
  .statgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-bottom:16px; }
  .statbox{ border:2px solid var(--line); border-radius:14px; padding:10px 12px; }
  .statbox b{ display:block; font-size:1.25rem; font-weight:900; }
  .statbox span{ font-size:.74rem; color:var(--muted); font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .badges{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; }
  .badge{ border:2px solid var(--gold); background:#FFFBEB; border-radius:14px; padding:10px 8px; text-align:center; }
  .badge .b-e{ font-size:1.7rem; }
  .badge .b-n{ font-size:.78rem; font-weight:900; margin-top:2px; }
  .badge .b-d{ font-size:.68rem; color:var(--muted); font-weight:700; }
  .badge.locked{ border-color:var(--line); background:#FAFAFA; filter:grayscale(1); opacity:.6; }
  .setrow{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:2px solid #F0F0F0; }
  .setrow label{ font-weight:800; font-size:.95rem; }
  .setrow select{ font-family:inherit; font-weight:800; border:2px solid var(--line); border-radius:10px; padding:6px 10px; }
  .switch{ border:none; border-radius:99px; width:52px; height:30px; background:var(--gray); position:relative; transition:background .15s; }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .15s; }
  .switch.on{ background:var(--green); }
  .switch.on::after{ left:25px; }

  #savepill{ position:fixed; left:12px; bottom:96px; z-index:70;
    background:#fff; border:2px solid var(--line); border-radius:99px; padding:4px 12px;
    font-size:.74rem; font-weight:900; color:var(--green-d);
    opacity:0; transform:translateY(6px); transition:opacity .25s, transform .25s; pointer-events:none; }
  #savepill.show{ opacity:1; transform:translateY(0); }

  footer{ text-align:center; color:#AFAFAF; font-size:.78rem; padding:8px 16px 100px; }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div class="statbar">
  <div class="statbar-in">
    <span class="logo">Oté<em> !</em> Kréol</span>
    <div class="stats-right">

let _lastSave = 0, _saveTimer = null;
function writeSave(){
  _lastSave = Date.now();
  mem[KEY] = state;
  const raw = JSON.stringify(state);

  if (wait <= 0){ writeSave(); }
  else if (!_saveTimer){ _saveTimer = setTimeout(() => { _saveTimer = null; writeSave(); }, wait); }
}
function flushSave(){
  if (_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; }
  _lastSave = Date.now();
  mem[KEY] = state;
  const raw = JSON.stringify(state);
  if (HAS_LS){ try{ localStorage.setItem(KEY, raw); }catch(e){} }
  try{ if (window.storage) window.storage.set(KEY, raw); }catch(e){}
}

    try{

      const st = (d && d.app === "otekreol") ? d.state : d; // accepte aussi un état brut

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’']/g," ").replace(/[.,!?«»…:;]/g,"").replace(/\s+/g," ").trim();
}
function sameSentence(a, b){
  const na = norm(a), nb = norm(b);
  return na === nb || na.replace(/ /g,"") === nb.replace(/ /g,"");
}
function tokens(ex){ return ex.split(/\s+/).map(t => t.replace(/[.,!?«»…]/g,"")).filter(Boolean); }

let AC = null;
function beep(f, st, d, type, v){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, AC.currentTime + st);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + st + d);
  o.connect(g); g.connect(AC.destination);
  o.start(AC.currentTime + st); o.stop(AC.currentTime + st + d + .02);
}
function sfx(kind){
  if (!state.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    if (kind === "ok"){ beep(660,0,.1,"sine",.18); beep(880,.09,.14,"sine",.18); }
    else if (kind === "ko"){ beep(190,0,.2,"square",.12); }
    else if (kind === "match"){ beep(740,0,.09,"sine",.15); }
    else if (kind === "tick"){ beep(980,0,.05,"sine",.1); }
    else if (kind === "win"){ [523,659,784,1046].forEach((f,i) => beep(f, i*.11, .16, "sine", .16)); }
  }catch(e){}
}

/* ============================================================
   GÉNÉRATION DES EXERCICES
   ============================================================ */
function makeChoose(w, pool){
  const dir = Math.random() < .5 ? "kr" : "fr";
  const autres = shuffle(pool.filter(x => x.kr !== w.kr)).slice(0, 3);
  return { k:"choose", w, dir, options: shuffle([w, ...autres]) };
}
function makeListen(w, pool){
  const autres = shuffle(pool.filter(x => x.kr !== w.kr)).slice(0, 3);
  return { k:"listen", w, options: shuffle([w, ...autres]) };
}
function makeBuild(w){
  const bons = tokens(w.ex);
  const faux = shuffle(TILE_POOL.filter(t => !bons.some(b => norm(b) === norm(t)))).slice(0, 3);
  return { k:"build", w, bons, tiles: shuffle([...bons, ...faux]).map((txt, i) => ({ id:i, txt })) };
}
const typeable  = w => !w.kr.includes("…") && w.kr.length <= 14;
const buildable = w => w.ex && w.ext && tokens(w.ex).length >= 3 && tokens(w.ex).length <= 6;

function buildWordExercises(words, optPool, opts){
  opts = opts || {};
  const exs = [];
  let nT = 0, nB = 0, nL = 0;
  for (const w of shuffle(words)){
    if (nB < (opts.maxBuild ?? 2) && buildable(w)){ exs.push(makeBuild(w)); nB++; }
    else if (nL < (opts.maxListen ?? 1) && ttsOn() && w.kr.length <= 18){ exs.push(makeListen(w, optPool)); nL++; }
    else if (nT < (opts.maxType ?? 2) && typeable(w) && Math.random() < .6){ exs.push({ k:"type", w }); nT++; }
    else exs.push(makeChoose(w, optPool));
  }
  if (words.length >= 4 && !opts.noMatch) exs.push({ k:"match", pairs: shuffle(words).slice(0, 4) });
  return shuffle(exs);
}

function buildLessonExercises(lesson){
  if (lesson.gram){
    const u = lesson.unit;
    const exs = u.fills.map(f => ({ k:"fill", f }));
    u.types.forEach(t => exs.push({ k:"type", w:t }));
    return shuffle(exs);
  }
  if (lesson.boss){
    const words = shuffle(lesson.secWords).slice(0, lesson.final ? 10 : 9);
    return buildWordExercises(words, lesson.secWords, { maxListen: ttsOn() ? 2 : 0 });
  }
  return buildWordExercises(lesson.words, lesson.words.length >= 4 ? lesson.words : ALLW);
}

/* ============================================================
   MOTEUR DE SESSION (leçons + entraînements)
   ============================================================ */
const PRAISE = ["Sa mèm !","Gadiamb !","Trè bien !","Lé bon !","Ekselan !","Gayar !"];

function lessonCfg(lesson, replay){
  return {
    meta:{ lessonId: lesson.id, replay: !!replay },
    hearts: 4,
    onFinish(res){
      let gain = lesson.final ? 30 : (lesson.boss ? 20 : 10);
      if (res.fautes === 0){ gain += 5; state.flags.perfect = true; }
      if (replay) gain = Math.max(5, Math.floor(gain / 2));
      state.done[lesson.id] = true;
      return gain;
    },
    retry: () => launchLesson(lesson, replay)
  };
}

function launchLesson(lesson, replay){
  const cfg = lessonCfg(lesson, replay);
  cfg.exercises = buildLessonExercises(lesson);
  if (lesson.gram && !replay) showTip(lesson.unit.tip, () => runSession(cfg));
  else runSession(cfg);
}

/* Reprise d'une leçon interrompue (fermeture de la page en cours de session) */
function resumeLesson(lesson, s){
  const cfg = lessonCfg(lesson, s.meta.replay);
  cfg.exercises = [];
  cfg.resume = { pending:s.pending, hearts:s.hearts, good:s.good, fautes:s.fautes, total:s.total };
  runSession(cfg);
}

        <div class="tipbody">${tip.html}</div>
      </div>
      <button class="btn-duo wide" id="go">C’est parti !</button>
      <br><button class="btn-duo white wide" id="back" style="margin-top:10px">← Retour</button>
    </div>`;
  app.querySelector("#go").addEventListener("click", go);
  app.querySelector("#back").addEventListener("click", () => goTab("path"));
  window.scrollTo(0,0);
}

function runSession(cfg){
  const resume = cfg.resume || null;
  const queue = resume ? resume.pending.slice() : cfg.exercises.slice();
  const total = resume ? resume.total : queue.length;
  const withHearts = cfg.hearts != null;
  let hearts = resume ? resume.hearts : (cfg.hearts ?? 0);
  let good = resume ? resume.good : 0, fautes = resume ? resume.fautes : 0;
  let cur = null, phase = "answer";
  let getAnswer = null, showResult = null;

  /* Sauvegarde continue : après chaque réponse et à chaque nouvel exercice */
  function persistSession(includeCur){
    if (cfg.meta){
      const pending = includeCur && cur ? [cur, ...queue] : queue.slice();
      state.session = pending.length ? { meta:cfg.meta, pending, hearts, good, fautes, total } : null;
    }
    saveState();
  }

  document.body.classList.add("in-lesson");

  function heartsHTML(){
    if (!withHearts) return "<span class='soft'>Entraînement</span>";
    let h = "";
    for (let i = 0; i < cfg.hearts; i++) h += `<span class="${i < hearts ? "" : "lost"}">❤️</span>`;
    return h;
  }

  function frame(inner){
    app.innerHTML = `
      <div class="lesson-top">
        <button class="xbtn" id="quit" aria-label="Quitter">✕</button>
        <div class="ltrack"><span style="width:${Math.round(100 * good / total)}%"></span></div>
        <div class="hearts">${heartsHTML()}</div>
      </div>
      <div class="ex-area">${inner}</div>
      <div class="checkbar" id="checkbar">
        <div class="checkbar-in">
          <div class="fb" id="fb"></div>
          <button class="btn-duo" id="mainbtn" disabled>Vérifier</button>
        </div>
      </div>`;
    app.querySelector("#quit").addEventListener("click", confirmQuit);
    window.scrollTo(0,0);
  }
  function setMainEnabled(on){ app.querySelector("#mainbtn").disabled = !on; }

  function next(){
    if (withHearts && hearts <= 0){ failScreen(); return; }
    if (!queue.length){ finish(); return; }
    cur = queue.shift();
    phase = "answer";
    persistSession(true);
    render[cur.k]();
  }

  function check(){
    const res = getAnswer();
    phase = "checked";
    if (res.ok){ good++; state.stats.right++; sfx("ok"); }
    else { fautes++; state.stats.wrong++; if (withHearts) hearts--; sfx("ko"); queue.push(cur); }
    if (res.word) bumpWord(res.word, res.ok);
    persistSession(false);
    showResult(res.ok);

    app.querySelector("#checkbar").classList.add(res.ok ? "ok" : "ko");
    app.querySelector(".ltrack span").style.width = Math.round(100 * good / total) + "%";
    app.querySelector(".hearts").innerHTML = heartsHTML();

    if (res.ok && res.say) speak(res.say);

    app.querySelector("#fb").innerHTML = res.ok
      ? `<div class="fb-ic">✓</div><div><div class="fb-t">${PRAISE[Math.floor(Math.random()*PRAISE.length)]}</div>${res.sub ? `<div class="fb-s">${esc(res.sub)}</div>` : ""}</div>`
      : `<div class="fb-ic">✕</div><div><div class="fb-t">Pa sa…</div><div class="fb-s">Bonne réponse : ${esc(res.correctLabel)}</div></div>`;

    const btn = app.querySelector("#mainbtn");
    btn.textContent = "Continuer";
    btn.disabled = false;
    if (!res.ok) btn.classList.add("red"); else btn.classList.remove("red");
    btn.onclick = next;
    btn.focus();
  }
  function wireMain(){
    const btn = app.querySelector("#mainbtn");
    btn.onclick = () => { if (phase === "answer" && !btn.disabled) check(); };
  }

  /* ---------- rendus d’exercices ---------- */
  const render = {

    choose(){
      const q = cur, demandeKreol = q.dir === "kr";
      let sel = null;
      frame(`
        <h2 class="ex-title">${demandeKreol ? "Choisis la traduction en kréol" : "Kosa i vé dir ?"}</h2>
        <div class="speech"><span class="m">🦎</span>
          <div class="bubble">${esc(demandeKreol ? q.w.fr : q.w.kr)}
            ${!demandeKreol && ttsOn() ? `<button class="minisay" id="say" aria-label="Écouter">🔊</button>` : ""}
          </div></div>
        <div class="options">
          ${q.options.map((o,i) => `<button class="option" data-i="${i}"><span class="okey">${i+1}</span>${esc(demandeKreol ? o.kr : o.fr)}</button>`).join("")}
        </div>`);
      const say = app.querySelector("#say");
      if (say) say.addEventListener("click", () => speak(q.w.kr));
      const opts = app.querySelectorAll(".option");
      function pick(i){
        if (phase !== "answer") return;
        sel = i;
        opts.forEach((o,j) => o.classList.toggle("selected", j === i));
        setMainEnabled(true);
      }
      opts.forEach((o,i) => o.addEventListener("click", () => pick(i)));
      getAnswer = () => ({ ok:q.options[sel].kr === q.w.kr, word:q.w.kr,
                           correctLabel: demandeKreol ? q.w.kr : q.w.fr,
                           say: demandeKreol ? q.w.kr : null });
      showResult = () => opts.forEach((o,i) => {
        o.disabled = true;
        if (q.options[i].kr === q.w.kr) o.classList.add("right");
        else if (i === sel) o.classList.add("wrongsel");
      });
      wireMain();
      window.__key = e => {
        if (phase === "answer" && /^[1-4]$/.test(e.key) && opts[e.key-1]) pick(Number(e.key)-1);
        if (e.key === "Enter") app.querySelector("#mainbtn").click();
      };
    },

    listen(){
      const q = cur;
      let sel = null;
      frame(`
        <h2 class="ex-title">Kosa ou i antann ? <span class="soft">· qu’entends-tu ?</span></h2>
        <button class="bigplay" id="play" aria-label="Écouter le mot">🔊</button>
        <div class="options">
          ${q.options.map((o,i) => `<button class="option" data-i="${i}"><span class="okey">${i+1}</span>${esc(o.kr)}</button>`).join("")}
        </div>`);
      const play = () => speak(q.w.kr);
      app.querySelector("#play").addEventListener("click", play);
      setTimeout(play, 350);
      const opts = app.querySelectorAll(".option");
      function pick(i){
        if (phase !== "answer") return;
        sel = i;
        opts.forEach((o,j) => o.classList.toggle("selected", j === i));
        setMainEnabled(true);
      }
      opts.forEach((o,i) => o.addEventListener("click", () => pick(i)));
      getAnswer = () => ({ ok:q.options[sel].kr === q.w.kr, word:q.w.kr,
                           correctLabel:q.w.kr, sub:q.w.fr });
      showResult = () => opts.forEach((o,i) => {
        o.disabled = true;
        if (q.options[i].kr === q.w.kr) o.classList.add("right");
        else if (i === sel) o.classList.add("wrongsel");
      });
      wireMain();
      window.__key = e => {
        if (phase === "answer" && /^[1-4]$/.test(e.key) && opts[e.key-1]) pick(Number(e.key)-1);
        if (e.key === "Enter") app.querySelector("#mainbtn").click();
      };
    },

    fill(){
      const q = cur.f;
      let sel = null;
      const options = shuffle(q.opts);
      frame(`
        <h2 class="ex-title">Complète la phrase</h2>
        <div class="fillline">${esc(q.s).replace("___", `<span class="gap" id="gap">&nbsp;</span>`)}</div>
        <div class="fillhint">« ${esc(q.fr)} »</div>
        <div class="options">
          ${options.map((o,i) => `<button class="option" data-i="${i}"><span class="okey">${i+1}</span>${esc(o)}</button>`).join("")}
        </div>`);
      const opts = app.querySelectorAll(".option");
      const gap = app.querySelector("#gap");
      function pick(i){
        if (phase !== "answer") return;
        sel = i;
        gap.textContent = options[i];
        opts.forEach((o,j) => o.classList.toggle("selected", j === i));
        setMainEnabled(true);
      }
      opts.forEach((o,i) => o.addEventListener("click", () => pick(i)));
      getAnswer = () => ({ ok: options[sel] === q.a,
                           correctLabel: q.s.replace("___", q.a),
                           say: q.s.replace("___", q.a) });
      showResult = ok => {
        opts.forEach((o,i) => {
          o.disabled = true;
          if (options[i] === q.a) o.classList.add("right");
          else if (i === sel) o.classList.add("wrongsel");
        });
        if (ok) gap.style.color = "var(--green-d)";
      };
      wireMain();
      window.__key = e => {
        if (phase === "answer" && /^[1-4]$/.test(e.key) && opts[e.key-1]) pick(Number(e.key)-1);
        if (e.key === "Enter") app.querySelector("#mainbtn").click();
      };
    },

    build(){
      const q = cur;
      const placed = [];
      frame(`
        <h2 class="ex-title">Écris la phrase en kréol</h2>
        <div class="speech"><span class="m">🦎</span><div class="bubble">« ${esc(q.w.ext)} »</div></div>
        <div class="answerline" id="line" aria-label="Ta réponse"></div>
        <div class="tilebank" id="bank"></div>`);
      const line = app.querySelector("#line"), bank = app.querySelector("#bank");
      function draw(){
        line.innerHTML = placed.map(t => `<button class="tile" data-p="${t.id}">${esc(t.txt)}</button>`).join("");
        bank.innerHTML = q.tiles.map(t => {
          const used = placed.some(p => p.id === t.id);
          return `<button class="tile${used ? " ghost" : ""}" data-b="${t.id}" ${used ? "disabled" : ""}>${esc(t.txt)}</button>`;
        }).join("");
        line.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
          if (phase !== "answer") return;
          const i = placed.findIndex(p => p.id === Number(b.dataset.p));
          if (i > -1) placed.splice(i, 1);
          draw();
        }));
        bank.querySelectorAll("[data-b]:not([disabled])").forEach(b => b.addEventListener("click", () => {
          if (phase !== "answer") return;
          placed.push(q.tiles.find(t => t.id === Number(b.dataset.b)));
          draw();
        }));
        setMainEnabled(placed.length > 0);
      }
      draw();
      getAnswer = () => ({ ok: sameSentence(placed.map(t => t.txt).join(" "), q.bons.join(" ")),
                           word:q.w.kr, correctLabel:q.w.ex, say:q.w.ex });
      showResult = () => app.querySelectorAll(".tile").forEach(b => b.disabled = true);
      wireMain();
      window.__key = e => { if (e.key === "Enter") app.querySelector("#mainbtn").click(); };
    },

    type(){
      const q = cur;
      frame(`
        <h2 class="ex-title">Écris en kréol rénioné</h2>
        <div class="speech"><span class="m">🦎</span><div class="bubble">« ${esc(q.w.fr)} »</div></div>
        <input class="tinput" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="Écris en kréol…" aria-label="Ta réponse en créole">`);
      const inp = app.querySelector("#tin");
      inp.focus();
      inp.addEventListener("input", () => setMainEnabled(inp.value.trim().length > 0));
      getAnswer = () => ({ ok: sameSentence(inp.value, q.w.kr), word:q.w.kr,
                           correctLabel:q.w.kr, say:q.w.kr });
      showResult = () => { inp.disabled = true; };
      wireMain();
      window.__key = e => { if (e.key === "Enter") app.querySelector("#mainbtn").click(); };
    },

    match(){
      const q = cur;
      const gauche = shuffle(q.pairs), droite = shuffle(q.pairs);
      let selL = null, selR = null, faits = 0;
      frame(`
        <h2 class="ex-title">Associe les paires</h2>
        <div class="match">
          <div class="mcol">${gauche.map(p => `<button class="mbtn" data-l="${esc(p.kr)}">${esc(p.fr)}</button>`).join("")}</div>
          <div class="mcol">${droite.map(p => `<button class="mbtn" data-r="${esc(p.kr)}">${esc(p.kr)}</button>`).join("")}</div>
        </div>`);
      const btnL = app.querySelectorAll("[data-l]"), btnR = app.querySelectorAll("[data-r]");
      function tryMatch(){
        if (!selL || !selR) return;
        const a = selL, b = selR; selL = selR = null;
        if (a.dataset.l === b.dataset.r){
          faits++; sfx("match"); bumpWord(a.dataset.l, true);
          [a,b].forEach(x => { x.classList.remove("selected"); x.classList.add("matched"); x.disabled = true; });
          if (faits === q.pairs.length){
            phase = "checked"; good++; state.stats.right++; sfx("ok");
            persistSession(false);
            app.querySelector("#checkbar").classList.add("ok");
            app.querySelector(".ltrack span").style.width = Math.round(100 * good / total) + "%";
            app.querySelector("#fb").innerHTML = `<div class="fb-ic">✓</div><div><div class="fb-t">Gadiamb ! Tout lé bon.</div></div>`;
            const btn = app.querySelector("#mainbtn");
            btn.textContent = "Continuer"; btn.disabled = false; btn.onclick = next; btn.focus();
          }
        } else {
          [a,b].forEach(x => { x.classList.remove("selected"); x.classList.add("shake"); });
          setTimeout(() => [a,b].forEach(x => x.classList.remove("shake")), 320);
        }
      }
      btnL.forEach(b => b.addEventListener("click", () => {
        if (b.classList.contains("matched") || phase !== "answer") return;
        btnL.forEach(x => x.classList.remove("selected"));
        b.classList.add("selected"); selL = b; tryMatch();
      }));
      btnR.forEach(b => b.addEventListener("click", () => {
        if (b.classList.contains("matched") || phase !== "answer") return;
        btnR.forEach(x => x.classList.remove("selected"));
        b.classList.add("selected"); selR = b; tryMatch();
      }));
      getAnswer = () => ({ ok:true, correctLabel:"" });
      showResult = () => {};
      window.__key = e => { if (e.key === "Enter" && phase === "checked") app.querySelector("#mainbtn").click(); };
    }
  };

  /* ---------- sorties ---------- */
  function confirmQuit(){
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <div class="m">🦎</div>
        <h3>Ou vé kit la sésion ?</h3>
        <p>Si tu quittes maintenant, la progression de cette session sera perdue.</p>
        <div class="btns">
          <button class="btn-duo" id="stay">Continuer</button>
          <button class="btn-duo white" id="leave">Quitter</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector("#stay").addEventListener("click", () => ov.remove());
    ov.querySelector("#leave").addEventListener("click", () => { state.session = null; saveState(); ov.remove(); goTab(activeTab); });
  }

  function failScreen(){
    window.__key = null;
    state.session = null;
    app.innerHTML = `
      <div class="center-screen">
        <div class="m-big">💔</div>
        <h2>Ou la pèrdi out bann kèr !</h2>
        <p class="soft" style="margin-bottom:24px">Kass pa la tèt… réessaie, ti pa ti pa !</p>
        <div class="rescards">
          <div class="rescard" style="--rc:var(--red)"><span>BONNES RÉPONSES</span><b>${good}/${total}</b></div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
          <button class="btn-duo" id="retry">Réessayer</button>
          <button class="btn-duo white" id="back">Retour</button>
        </div>
      </div>`;
    app.querySelector("#retry").addEventListener("click", cfg.retry);
    app.querySelector("#back").addEventListener("click", () => goTab(activeTab));
    saveState();
  }

  function finish(){
    window.__key = null;
    state.session = null;
    const gain = cfg.onFinish({ good, fautes, total });
    addXP(gain);
    const nouvelleSerie = bumpStreak();
    const news = checkBadges();
    saveState();
    sfx("win");
    const acc = Math.round(100 * total / (total + fautes));
    app.innerHTML = `
      <div class="center-screen">
        <div class="m-big">🦎</div>
        <div class="cheer">${fautes === 0 ? "Parfait ! Gadiamb !" : "Lé gadiamb !"}</div>
        <h2>${esc(cfg.doneTitle || "Sésion fini !")}</h2>
        <div class="rescards">
          <div class="rescard" style="--rc:var(--gold-d)"><span>XP GAGNÉ</span><b>+${gain}</b></div>
          <div class="rescard" style="--rc:var(--green)"><span>PRÉCISION</span><b>${acc}%</b></div>
          <div class="rescard" style="--rc:var(--orange)"><span>SÉRIE</span><b>🔥 ${state.streak.count}</b></div>
        </div>
        ${news.length ? `<div class="newbadges">${news.map(b => `<span class="badgechip">${b.e} ${esc(b.n)}</span>`).join("")}</div>` : ""}
        ${nouvelleSerie ? `<p style="color:var(--orange);font-weight:900;margin:-8px 0 22px">🔥 Série prolongée : reviens demain !</p>` : ""}
        <button class="btn-duo" id="cont">Continuer</button>
      </div>`;
    app.querySelector("#cont").addEventListener("click", () => goTab(activeTab));
    window.__key = e => { if (e.key === "Enter") app.querySelector("#cont").click(); };
  }

  next();
}

/* ============================================================
   ENTRAÎNEMENT
   ============================================================ */
function seenWords(){ return ALLW.filter(w => state.words[w.kr]); }
function dueWords(){
  const now = Date.now(), J3 = 3 * 864e5;
  return seenWords()
    .filter(w => { const s = state.words[w.kr]; return s.s <= 2 || (now - s.t > J3 && s.s < 5); })
    .sort((a,b) => (state.words[a.kr].s - state.words[b.kr].s) || (state.words[a.kr].t - state.words[b.kr].t));
}

function renderTrain(){
  const due = dueWords().length;
  const errs = state.errs.length;
  app.innerHTML = `
    ${goalCardHTML()}
    <h2 style="margin:6px 0 12px">Antrènman <span class="soft">· sans cœurs, juste pour progresser</span></h2>

    <button class="train-card" id="t-srs" ${seenWords().length ? "" : "disabled"}>
      <span class="t-ic">🔁</span>
      <div class="t-body"><h3>Révision intelligente</h3>
      <div class="soft">Les mots faibles ou pas vus depuis longtemps</div></div>
      ${due ? `<span class="due">${due} à revoir</span>` : ""}
    </button>

    <button class="train-card" id="t-err" ${errs ? "" : "disabled"}>
      <span class="t-ic">❌</span>
      <div class="t-body"><h3>Mes erreurs</h3>
      <div class="soft">Retravaille tes dernières fautes</div></div>
      ${errs ? `<span class="due">${errs}</span>` : ""}
    </button>

    <button class="train-card" id="t-ecoute" ${TTS_SUPPORT ? "" : "disabled"}>
      <span class="t-ic">🎧</span>
      <div class="t-body"><h3>Écoute</h3>
      <div class="soft">${TTS_SUPPORT ? "Reconnais les mots à l’oreille (voix de synthèse)" : "Indisponible sur ce navigateur"}</div></div>
    </button>

    <button class="train-card" id="t-chrono">
      <span class="t-ic">⏱️</span>
      <div class="t-body"><h3>Défi chrono</h3>
      <div class="soft">60 secondes, un maximum de bonnes réponses !</div></div>
    </button>`;

  const pool = seenWords().length >= 8 ? seenWords() : ALLW;

  app.querySelector("#t-srs").addEventListener("click", () => {
    if (!seenWords().length) return;
    const mots = dueWords().slice(0, 10);
    const list = mots.length >= 4 ? mots : shuffle(seenWords()).slice(0, 8);
    runSession({
      exercises: buildWordExercises(list, pool, { noMatch:list.length < 4 }),
      hearts: null, doneTitle: "Révizion fini !",
      onFinish: r => r.fautes === 0 ? 10 : 8,
      retry: renderTrain
    });
  });

  app.querySelector("#t-err").addEventListener("click", () => {
    if (!state.errs.length) return;
    const mots = state.errs.map(kr => ALLW.find(w => w.kr === kr)).filter(Boolean).slice(0, 8);
    runSession({
      exercises: buildWordExercises(mots, pool, { noMatch:mots.length < 4 }),
      hearts: null, doneTitle: "Bann zerèr korizé !",
      onFinish(r){
        if (r.fautes === 0) state.errs = state.errs.filter(kr => !mots.some(m => m.kr === kr));
        return 8;
      },
      retry: renderTrain
    });
  });

  app.querySelector("#t-ecoute").addEventListener("click", () => {
    if (!TTS_SUPPORT) return;
    state.tts = true;
    const mots = shuffle(pool).slice(0, 8);
    runSession({
      exercises: shuffle(mots.map(w => makeListen(w, pool))),
      hearts: null, doneTitle: "Zorèy fine shofé !",
      onFinish: r => r.fautes === 0 ? 10 : 8,
      retry: renderTrain
    });
  });

  app.querySelector("#t-chrono").addEventListener("click", runChrono);
}

/* ---------- Défi chrono ---------- */
function runChrono(){
  document.body.classList.add("in-lesson");
  let left = 60, score = 0, ended = false;
  let timerId = null;

  function fin(){
    if (ended) return;
    ended = true;
    clearInterval(timerId);
    window.__key = null;
    if (score >= 15) state.flags.chrono15 = true;
    const gain = Math.min(20, score);
    addXP(gain);
    bumpStreak();
    const news = checkBadges();
    saveState();
    sfx("win");
    app.innerHTML = `
      <div class="center-screen">
        <div class="m-big">⏱️</div>
        <h2>Tan lé fini !</h2>
        <div class="rescards">
          <div class="rescard" style="--rc:var(--orange)"><span>BONNES RÉPONSES</span><b>${score}</b></div>
          <div class="rescard" style="--rc:var(--gold-d)"><span>XP GAGNÉ</span><b>+${gain}</b></div>
        </div>
        ${news.length ? `<div class="newbadges">${news.map(b => `<span class="badgechip">${b.e} ${esc(b.n)}</span>`).join("")}</div>` : ""}
        <button class="btn-duo" id="again">Rejouer</button>
        <button class="btn-duo white" id="back" style="margin-left:10px">Retour</button>
      </div>`;
    app.querySelector("#again").addEventListener("click", runChrono);
    app.querySelector("#back").addEventListener("click", () => goTab("train"));
  }

  function tick(){
    left--;
    const t = app.querySelector("#timer");
    if (t) t.textContent = left + " s";
    if (left <= 5 && left > 0) sfx("tick");
    if (left <= 0) fin();
  }
  timerId = setInterval(tick, 1000);

  function question(){
    if (ended) return;
    const q = makeChoose(shuffle(ALLW)[0], ALLW);
    const demandeKreol = q.dir === "kr";
    app.innerHTML = `
      <div class="lesson-top">
        <button class="xbtn" id="quit" aria-label="Quitter">✕</button>
        <div class="ltrack"><span style="width:${Math.min(100, score*5)}%"></span></div>
        <div class="timer" id="timer">${left} s</div>
      </div>
      <div class="ex-area">
        <h2 class="ex-title">${demandeKreol ? "An kréol :" : "An fransé :"} <b>${esc(demandeKreol ? q.w.fr : q.w.kr)}</b></h2>
        <div class="options">
          ${q.options.map((o,i) => `<button class="option" data-i="${i}"><span class="okey">${i+1}</span>${esc(demandeKreol ? o.kr : o.fr)}</button>`).join("")}
        </div>
        <p class="soft" style="margin-top:14px;text-align:center">Score : <b>${score}</b></p>
      </div>`;
    app.querySelector("#quit").addEventListener("click", fin);
    const opts = app.querySelectorAll(".option");
    function answer(i){
      if (ended) return;
      const ok = q.options[i].kr === q.w.kr;
      bumpWord(q.w.kr, ok);
      saveState();
      if (ok){ score++; state.stats.right++; sfx("match"); }
      else { state.stats.wrong++; sfx("ko"); }
      opts.forEach((o,j) => {
        o.disabled = true;
        if (q.options[j].kr === q.w.kr) o.classList.add("right");
        else if (j === i) o.classList.add("wrongsel");
      });
      setTimeout(question, ok ? 350 : 750);
    }
    opts.forEach((o,i) => o.addEventListener("click", () => answer(i)));
    window.__key = e => { if (/^[1-4]$/.test(e.key) && opts[e.key-1] && !opts[e.key-1].disabled) answer(Number(e.key)-1); };
  }
  question();
}

function renderDico(){
  app.innerHTML = `
    <h2 style="margin-bottom:10px">Diksionèr <span class="soft">· ${ALLW.length} mots et expressions</span></h2>
    <input class="search" id="q" placeholder="Cherche un mot (kréol ou français)…" aria-label="Recherche">
    <div id="list"></div>`;
  const list = app.querySelector("#list");
  const q = app.querySelector("#q");

  function row(w){
    const s = state.words[w.kr] ? state.words[w.kr].s : 0;
    let dots = "";
    for (let i = 0; i < 5; i++) dots += `<i class="${i < s ? "on" : ""}"></i>`;
    return `
      <div class="dic-row">
        ${TTS_SUPPORT ? `<button class="minisay" data-say="${esc(w.kr)}" aria-label="Écouter ${esc(w.kr)}">🔊</button>` : ""}
        <div>
          <span class="d-kr">${esc(w.kr)}</span><span class="dots" title="Force de mémorisation">${dots}</span>
          <div class="d-fr">${esc(w.fr)}</div>
          ${w.ex ? `<div class="d-ex">« ${esc(w.ex)} »${w.ext ? " — " + esc(w.ext) : ""}</div>` : ""}
        </div>
      </div>`;
  }

  function draw(){
    const f = norm(q.value);
    let html = "";
    for (const sec of SECTIONS){
      for (const u of sec.units){
        if (u.gram) continue;
        const mots = u.lessons.flat().filter(w => !f || norm(w.kr).includes(f) || norm(w.fr).includes(f));
        if (!mots.length) continue;
        html += `<div class="dic-unit">${u.emoji} ${esc(u.nom)} · ${esc(u.fr)}</div>` + mots.map(row).join("");
      }
    }
    list.innerHTML = html || `<p class="soft" style="padding:20px 4px">Napwin nada… aucun mot trouvé. Essaie autre chose !</p>`;
    list.querySelectorAll("[data-say]").forEach(b =>
      b.addEventListener("click", () => { state.tts = true; speak(b.dataset.say); }));
  }
  q.addEventListener("input", draw);
  draw();
}

function infoModal(emoji, title, text){
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="m">${emoji}</div>
      <h3>${esc(title)}</h3>
      <p>${esc(text)}</p>
      <div class="btns"><button class="btn-duo" id="ok">OK</button></div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector("#ok").addEventListener("click", () => ov.remove());
}

function renderProf(){
  const lv = levelInfo();
  const tot = state.stats.right + state.stats.wrong;
  const acc = tot ? Math.round(100 * state.stats.right / tot) : 0;
  app.innerHTML = `
    <div class="prof-head">
      <div class="av">🦎</div>
      <div style="flex:1">
        <h2>Niveau ${lv.n} · ${esc(lv.title)}</h2>
        <div class="soft">${state.xp} XP${lv.next ? " · prochain niveau à " + lv.next + " XP" : " · niveau maximum !"}</div>
        <div class="lvlbar"><span style="width:${lv.pct}%"></span></div>
      </div>
    </div>

    <div class="statgrid">
      <div class="statbox"><b>🔥 ${state.streak.count}</b><span>Série (jours)</span></div>
      <div class="statbox"><b>⚡ ${state.xp}</b><span>XP total</span></div>
      <div class="statbox"><b>📚 ${learnedCount()}</b><span>Mots maîtrisés</span></div>
      <div class="statbox"><b>⭐ ${doneCount()}/${LESSONS.length}</b><span>Leçons finies</span></div>
      <div class="statbox"><b>🎯 ${acc}%</b><span>Précision</span></div>
    </div>

    <div class="card">
      <h3>🏅 Badges</h3>
      <div class="badges">
        ${BADGES.map(b => `
          <div class="badge ${state.badges[b.id] ? "" : "locked"}">
            <div class="b-e">${b.e}</div>
            <div class="b-n">${esc(b.n)}</div>
            <div class="b-d">${esc(b.d)}</div>
          </div>`).join("")}
      </div>
    </div>

    <div class="card">
      <h3>💾 Sauvegarde</h3>
      <p class="soft">${
        (typeof window !== "undefined" && window.storage) || HAS_LS
          ? "Ta progression est enregistrée <b>automatiquement, après chaque réponse</b>" + (HAS_LS ? ", dans ce navigateur" : "") + ". Si tu fermes en pleine leçon, on te proposera de la reprendre au même endroit à ton retour."
          : "⚠️ Aucune sauvegarde automatique n’est disponible ici : exporte ta progression dans un fichier avant de fermer, puis réimporte-le la prochaine fois."
      }</p>
      <p class="soft" style="margin-top:6px">Pour changer d’ordinateur ou garder une copie de secours, exporte un fichier de sauvegarde puis réimporte-le ailleurs.</p>
      <button class="btn-duo blue wide" id="exp" style="margin-top:12px">⬇️ Exporter ma progression</button>
      <button class="btn-duo white wide" id="impbtn" style="margin-top:10px">⬆️ Importer une sauvegarde</button>
      <input type="file" id="impfile" accept=".json,application/json" style="display:none" aria-label="Fichier de sauvegarde">
    </div>

    <div class="card">
      <h3>⚙️ Réglages</h3>
      <div class="setrow">
        <label for="goalsel">Objectif quotidien</label>
        <select id="goalsel">
          ${[10,20,30,50].map(g => `<option value="${g}" ${state.goal === g ? "selected" : ""}>${g} XP</option>`).join("")}
        </select>
      </div>
      <div class="setrow">
        <label>Effets sonores</label>
        <button class="switch ${state.sound ? "on" : ""}" id="sw-sound" role="switch" aria-checked="${state.sound}" aria-label="Effets sonores"></button>
      </div>
      <div class="setrow">
        <label>Voix (synthèse vocale)${TTS_SUPPORT ? "" : " — indisponible"}</label>
        <button class="switch ${ttsOn() ? "on" : ""}" id="sw-tts" role="switch" aria-checked="${ttsOn()}" aria-label="Voix de synthèse" ${TTS_SUPPORT ? "" : "disabled"}></button>

      <p class="soft" style="margin-top:10px">La voix utilise la synthèse française de ton navigateur : la prononciation créole est approximative, mais utile pour s’entraîner.</p>

  app.querySelector("#goalsel").addEventListener("change", e => { state.goal = Number(e.target.value); saveState(); });
  app.querySelector("#sw-sound").addEventListener("click", () => { state.sound = !state.sound; saveState(); renderProf(); refreshStats(); });
  const swt = app.querySelector("#sw-tts");
  if (TTS_SUPPORT) swt.addEventListener("click", () => { state.tts = !state.tts; saveState(); renderProf(); if (state.tts) speak("Bonzour !"); });

  app.querySelector("#exp").addEventListener("click", () => {
    if (exportSave()) infoModal("💾","Sauvegarde exportée","Un fichier « ote-kreol-sauvegarde-….json » a été téléchargé. Garde-le précieusement : tu pourras le réimporter ici, sur n’importe quel ordinateur.");

    const f = impfile.files && impfile.files[0];
    if (!f) return;
    importSave(f, ok => {
      if (ok){
        refreshStats(); renderProf();
        infoModal("✅","Sauvegarde importée","Nartrouv ! Ta progression a bien été restaurée : " + state.xp + " XP, " + doneCount() + " leçons finies.");

      <div class="modal">

        <h3>Tout réinitialiser ?</h3>
        <p>XP, série, badges, progression : tout sera effacé. Cette action est définitive.</p>
        <div class="btns">

          <button class="btn-duo red" id="yes">Oui, tout effacer</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector("#no").addEventListener("click", () => ov.remove());
    ov.querySelector("#yes").addEventListener("click", async () => {
      await wipeSave();
      ov.remove(); refreshStats(); goTab("path");
    });
  });
}
